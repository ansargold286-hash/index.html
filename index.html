main{flex:1;overflow-y:auto;padding:12px}
nav{display:grid;grid-template-columns:repeat(7,1fr);background:var(--card);border-top:1px solid var(--line)}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:13px}.muted{color:var(--muted);font-size:12px}
.btn{border:0;border-radius:10px;background:var(--acc);color:var(--on);font-weight:800;padding:9px 12px;font-size:13px;width:100%}
.btn.s{width:auto;padding:6px 12px;font-size:12px}.btn.o{background:none;border:1px solid var(--acc);color:var(--acc)}.btn.d{background:var(--bad);color:#fff}
.btn:disabled{opacity:.4}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}

.bar{height:8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}

function down(t){return !!(t.off||(S.cr&&S.cr.type==='power'&&(t.z||0)===S.cr.z))}

function crisisFail(){const c=S.cr;if(c.type==='storm')S.towers.forEach(t=>{if((t.z||0)===c.z){t.hp=10;t.cmp=Math.min(30,t.cmp+5)}});else if(c.type==='power'){S.users*=.9;S.rep=Math.max(0,S.rep-.08)}else{S.users*=.85;S.rep=Math.max(0,S.rep-.1)}S.cr=null;toast('Too late! Customers are leaving after the crisis')}

function calc(){
  const T=S.towers,G=GENS[S.gen];
  const pw=S.plans.map(planV),sw=pw.reduce((a,b)=>a+b,0)||1,dem=S.plans.reduce((a,p,i)=>a+S.users*pw[i]/sw*p.gb*30/p.days*.5/1000,0),pf=Math.min(1,S.pool/Math.max(.01,dem)),dm=Math.max(.1,Math.min(1.6,Math.pow(pw.reduce((a,b)=>a+b,0)/S.plans.length,.5)));

  const tcov=T.map(t=>3000*(1+.5*(t.lvl-1))*t.hp/100*(down(t)?0:1)),sc0=tcov.reduce((a,b)=>a+b,0)||1,zc=zp.map((_,z)=>T.reduce((a,t,i)=>a+((t.z||0)===z?tcov[i]:0),0)),qz=z=>{let a=0,b=0;T.forEach((t,i)=>{if((t.z||0)===z){a+=tcov[i]*(t.q||1);b+=tcov[i]}});return b?a/b:1},zt=zp.map((p,z)=>Math.min(p,zc[z])*(S.atk&&S.atk[z]?.5+.4*Math.min(1,qz(z)):1)),zs=zt.reduce((a,b)=>a+b,0)||1;

  const uu=ts.reduce((a,x)=>a+x.u,0),spd=uu>0?ts.reduce((a,x)=>a+x.u*x.spd,0)/uu:ts.reduce((a,x)=>a+x.spd,0)/ts.length;
  const sc=Math.min(1,Math.log10(1+spd)/3.3);

const TPL=[{n:'Daily Saver',price:25,days:1,gb:1,sms:20,min:30},{n:'Weekly Booster',price:99,days:7,gb:6,sms:100,min:150},{n:'Monthly Unlimited',price:299,days:30,gb:30,sms:300,min:500},{n:'Student Pack',price:149,days:30,gb:40,sms:200,min:200}];
function mk(){const d=S.dr;return{id:'p'+Date.now(),n:(d.n||'').trim()||(Math.max(0,d.gb)+' GB · '+Math.max(1,Math.round(d.days))+' day pack'),price:Math.max(1,d.price),days:Math.max(1,Math.round(d.days)),gb:Math.max(0,d.gb),sms:Math.max(0,Math.round(d.sms)),min:Math.max(0,Math.round(d.min))}}
function pv(){const p=mk(),c=pCost(p),r=p.price-c,k=calc(),w=planV(p),u=(S.users||1000)*w/(k.sw+w),ex=u*r/p.days,nd=reserve(p),sh=nd>left();return 'Cost to us per user: <b>Rs '+c.toFixed(1)+'</b> · Profit per user: <b style="color:'+(r>=0?'var(--good)':'var(--bad)')+'">Rs '+r.toFixed(1)+'</b> every '+p.days+' day(s)<br>Launch cost now: <b>Rs 5,000</b> · Expected profit: <b style="color:'+(ex>=0?'var(--good)':'var(--bad)')+'">'+rs(ex)+' a day</b> (about '+fm(u)+' users)<br>'+verdict(p)+'<br>Internet this package takes: <b>'+nd.toFixed(1)+' TB</b> · left '+left().toFixed(1)+' TB'+(sh?'<div style="color:var(--bad);margin-top:6px"><b>Internet is short.</b> Buy internet, or launch with fewer GB (up to '+Math.max(0,Math.floor(left()*10*p.days/30))+' GB).<br><button class="btn s" style="margin-top:6px" onclick="poolSet(1)">Buy +5 TB</button></div>':'')}
function dr(k,v){S.dr[k]=k==='n'?v:(parseFloat(v)||0);$('pv').innerHTML=pv()}
function tpl(i){Object.assign(S.dr,TPL[i]);render(true)}
function launchPlan(){if(lock())return;if(S.plans.length>=10){toast('Maximum 10 packages');return}const p=mk();if(reserve(p)>left()){toast('Not enough internet for this package');return}if(S.money<5000)return;S.money-=5000;S.plans.push(p);S.dr.n='';toast(p.n+' launched!');save();render(true)}
function editPlan(i){hold=0;const p=S.plans[i],f=(l,k)=>'<div><label class="muted">'+l+'</label><input id="ep-'+k+'" type="number" min="0" value="'+p[k]+'" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:14px"></div>';
  $('mb').innerHTML='<h3 style="margin:0 0 8px">Edit · '+p.n+'</h3><div class="g2">'+f('Price (Rs)','price')+f('Internet (GB)','gb')+f('SMS','sms')+f('Call minutes','min')+f('Valid for (days)','days')+'</div><div class="muted" style="margin:8px 0">Internet left for changes: '+(left()+reserve(p)).toFixed(1)+' TB</div><button class="btn" onclick="savePlan('+i+')">Save changes</button><div style="height:8px"></div><button class="btn o" onclick="closeM()">Close</button>';$('modal').className='ov'}
function savePlan(i){const p=S.plans[i],g=k=>parseFloat($('ep-'+k).value)||0,q={price:Math.max(1,g('price')),gb:Math.max(0,g('gb')),sms:Math.max(0,Math.round(g('sms'))),min:Math.max(0,Math.round(g('min'))),days:Math.max(1,Math.round(g('days')))};if(alloc()-reserve(p)+reserve(q)>S.pool+1e-9){toast('Not enough internet. Buy more or use fewer GB');return}Object.assign(p,q);toast('Package updated');save();closeM()}
let rmAsk=-1;
function removeTower(i){if(S.towers.length<2){toast('Keep at least one tower');return}if(rmAsk!==i){rmAsk=i;tower(i);setTimeout(()=>{if(rmAsk===i)rmAsk=-1},4000);return}S.towers.splice(i,1);rmAsk=-1;S.money+=5000;toast('Tower removed. Rs 5,000 salvage');save();closeM()}
function retire(i){if(S.plans.length<2){toast('Keep at least one package');return}S.plans.splice(i,1);save();render(true)}
function reserve(p){return p.gb*30/p.days/10}
function alloc(){return S.plans.reduce((a,p)=>a+reserve(p),0)}
function left(){return S.pool-alloc()}
function poolSet(d){if(d>0&&lock())return;if(d<0&&S.pool-5<alloc()){toast('That internet is already given to towers');return}S.pool=Math.max(1,S.pool+d*5);save();render(true)}
function netCard(c){const a=alloc(),l=S.pool-a;return '<div class="card"><h3>Internet</h3><div class="row"><span>Bought a month</span><b>'+S.pool+' TB</b></div><div class="row"><span>Used by packages</span><b>'+a+' TB</b></div><div class="row"><span>Left for new packages</span><b style="color:'+(l>0?'var(--good)':'var(--warn)')+'">'+l+' TB</b></div><div class="bar" style="margin:6px 0"><i style="width:'+Math.min(100,a/S.pool*100)+'%"></i></div><div class="row"><span>Your users need</span><b>'+c.dem.toFixed(1)+' TB</b></div><div class="muted" style="margin:6px 0 8px">'+(c.pf<1?'Not enough internet! Speed falls to '+Math.round(c.pf*100)+'%. Buy more. ':'')+'Only your packages use this internet. Costs Rs 1,000 per TB a month.</div><div class="g2"><button class="btn o" '+(S.pool-5>=a?'':'disabled')+' onclick="poolSet(-1)">−5 TB</button><button class="btn" onclick="poolSet(1)">Buy +5 TB · Rs 5,000/mo</button></div></div>'}
function vPlan(c){
  const d=S.dr,inp=(l,k,t)=>'<div><label class="muted">'+l+'</label><input type="'+(t||'number')+'" value="'+d[k]+'" min="0" oninput="dr(\''+k+'\',this.value)" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:14px"></div>';
  const pct=Math.min(100,c.dem/S.pool*100);
  const drawers=S.plans.map((p,i)=>{const u=S.users*c.pw[i]/c.sw,inc=u*p.price/p.days,cs=u*pCost(p)/p.days,pr=inc-cs;
    return '<div class="drw"><div class="row"><b>'+p.n+'</b><span class="tag">Rs '+p.price+' / '+p.days+'d</span></div><div class="muted">📶 '+p.gb+' GB · ✉️ '+p.sms+' SMS · 📞 '+p.min+' min</div><div style="font-size:11px;margin:4px 0">'+verdict(p)+'</div><div class="g2" style="margin:8px 0"><div class="muted">👤 Users<br><b style="color:#e5edf8">'+fm(u)+'</b></div><div class="muted">Income a day<br><b style="color:#e5edf8">'+rs(inc)+'</b></div><div class="muted">Cost a day<br><b style="color:#e5edf8">'+rs(cs)+'</b></div><div class="muted">Profit a day<br><b style="color:'+(pr>=0?'#4ade80':'#f87171')+'">'+rs(pr)+'</b></div></div><div style="display:flex;gap:8px"><button class="btn s o" onclick="editPlan('+i+')">Edit package</button><button class="btn s o" onclick="retire('+i+')">Retire</button></div><div class="hdl"></div></div>'}).join('<div style="height:6px"></div>');
  return pricing()
   +netCard(c)
   +'<div class="card"><h3>Design a new package</h3><div class="muted" style="margin-bottom:6px">Start from a template or type your own numbers.</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">'+TPL.map((t,i)=>'<button class="btn s o" onclick="tpl('+i+')">'+t.n+'</button>').join('')+'</div>'
   +'<div class="g2">'+inp('Package name','n','text')+inp('Price (Rs)','price')+inp('Internet (GB)','gb')+inp('SMS','sms')+inp('Call minutes','min')+inp('Valid for (days)','days')+'</div><div class="muted" id="pv" style="margin:10px 0">'+pv()+'</div><button class="btn" '+(S.money>=5000?'':'disabled')+' onclick="launchPlan()">Launch package</button></div>'
   +'<div class="card"><h3>Your packages</h3><div class="rack" style="padding:6px">'+drawers+'</div></div>';
}
function vAds(){
  return '<div class="card"><div class="muted">News and advertising bring new users, but cost money every single day. Pick a level.</div></div>'+ADS.map((a,i)=>'<div class="card" style="'+(S.ads===i?'border-color:var(--acc)':'')+'"><div class="row"><b>'+a.n+'</b><span class="tag '+(S.ads===i?'ok':'')+'">'+(S.ads===i?'RUNNING':'+'+Math.round(a.b*100)+'% appeal')+'</span></div><div class="muted" style="margin:3px 0 8px">'+(a.c?rs(a.c)+' a day':'No cost')+'</div>'+(S.ads===i?'':'<button class="btn o" onclick="setAds('+i+')">Choose</button>')+'</div>').join('');
}
function setAds(i){S.ads=i;toast('Ads: '+ADS[i].n);save();render(true)}
function vTeam(){
  return staffCard()+'<div class="card"><div class="muted">Employees are paid salary every day. Hiring costs a one-time fee.</div></div>'+Object.keys(STAFF).map(k=>{const s=STAFF[k],n=S.staff[k];
    return '<div class="card"><div class="row"><b>'+s.n+'</b><span class="tag">'+n+' hired</span></div><div class="muted" style="margin:3px 0 8px">'+s.fx+' · '+rs(s.sal)+' a day each · <b style="color:'+(n<need()[k]?'var(--bad)':'var(--good)')+'">need '+need()[k]+'</b></div><div class="g2"><button class="btn o" '+(n?'':'disabled')+' onclick="staff(\''+k+'\',-1)">Fire one</button><button class="btn" '+(S.money>=s.fee&&n<10?'':'disabled')+' onclick="staff(\''+k+'\',1)">Hire · '+rs(s.fee)+'</button></div></div>'}).join('');
}
function staff(k,d){const s=STAFF[k];if(d>0){if(S.money<s.fee||S.staff[k]>=10)return;S.money-=s.fee}else if(!S.staff[k])return;S.staff[k]+=d;save();render(true)}
function vFin(){
  const f=S.fin,row=(a,b)=>'<tr><td>'+a+'</td><td>'+b+'</td></tr>';
  return charts()+'<div class="card"><h3>Today’s money</h3><table>'+row('Income from users',rs(f.rev))+row('Tax (15%)','-'+rs(f.tax))+row('Salaries','-'+rs(f.sal))+row('Tower upkeep','-'+rs(f.twr))+row('News and ads','-'+rs(f.ads))+row('Network licence','-'+rs(f.lic))+row('Package costs','-'+rs(f.pk||0))+row('Internet purchase','-'+rs(f.nt||0))+row('<b>Profit today</b>','<span style="color:'+(f.net>=0?'var(--good)':'var(--bad)')+'">'+rs(f.net)+'</span>')+'</table></div>'
   +'<div class="card"><h3>Since launch</h3><table>'+row('Total income',rs(S.tot.rev))+row('Tax paid',rs(S.tot.tax))+row('Other expenses',rs(S.tot.exp))+'</table></div>'
   +'<div class="card"><h3>Goal: King of Pakistan · '+S.zn+'/'+ZONES.length+' zones</h3><div class="bar"><i style="width:'+S.zn/ZONES.length*100+'%"></i></div><div class="muted" style="margin-top:6px">'+fm(S.users)+' users joined · '+fm(S.sims)+' SIMs sold</div></div>'
   +'<button class="btn d" onclick="askReset()">'+(Date.now()-rstAsk<4000?'Tap again to delete everything':'Reset game')+'</button>';
}
const CATS=[['sal','Employee salaries'],['tax','Tax'],['twr','Tower upkeep'],['ads','News and ads'],['lic','Network licence'],['loan','Loan interest'],['fine','Government fine'],['pack','Package costs'],['net','Internet purchase']];
function fixS(){S.acc=S.acc||{sal:0,tax:0,twr:0,ads:0,lic:0,loan:0,fine:0,pack:0,net:0};S.invs=S.invs||[];S.price=S.price||1;S.riv=S.riv||[{n:'AirNova',ap:.55},{n:'Zephyr Mobile',ap:.5}];S.loan=S.loan||0;S.offer=S.offer||0;S.h=S.h||{u:[],r:[],g:[]};S.towers.forEach(t=>{t.bw=t.bw||2;t.sp=t.sp||3;t.cmp=t.cmp||0;t.w=t.w||1;t.q=t.q||1;t.g=t.g===undefined?S.gen:t.g;t.si=t.si===undefined?nearSp(GENS[t.g].spd*(t.sp||3)/3):t.si});S.monthMin=S.monthMin||15;S.nt=S.nt||{bw:2,sp:3};S.over=false;S.nt.si=S.nt.si===undefined?nearSp(GENS[S.gen].spd):S.nt.si;S.zn=S.zn||1;S.atk=S.atk||{};S.cr=S.cr||null;S.towers.forEach(t=>{t.z=Math.min(t.z||0,S.zn-1)});S.nt.z=Math.min(S.nt.z||0,S.zn-1);
  S.plans=S.plans.map(x=>{if(typeof x!=='string')return x;const p=PLANS.find(q=>q.id===x);return{id:x,n:p.n,price:p.arpu,days:30,gb:5,sms:100,min:100}});
  S.pool=Math.max(S.pool||5,Math.ceil(S.plans.reduce((a,p)=>a+p.gb*30/p.days/10,0)));S.dr=S.dr||{n:'',price:299,days:30,gb:10,sms:100,min:200};S.acc.pack=S.acc.pack||0;S.acc.net=S.acc.net||0}
function fairP(p){return Math.max(100,pCost(p)*30/p.days*3+80)}
function planV(p){const r=fairP(p)/(p.price*30/p.days);return Math.min(6,Math.max(.02,r*r))}
function verdict(p){const f=fairP(p),r=f/(p.price*30/p.days),t=r>1.8?'💥 Too cheap: overloaded, may lose money':r>1.25?'🔥 Cheap: many customers':r>.8?'✅ Fair price':r>.5?'😴 Expensive: fewer customers':'🚫 Very expensive: almost nobody buys';return t+' · fair ≈ Rs '+fm(f)+'/month'}
function pCost(p){return p.gb*1+p.sms*.02+p.min*.1}
function staffState(){const n=need(),k=Object.keys(STAFF),mn=Math.min(...k.map(x=>S.staff[x]/Math.max(1,n[x])));return{n,have:k.reduce((a,x)=>a+S.staff[x],0),light:k.every(x=>S.staff[x]>=n[x])?'🟢':mn>=.5?'🟡':'🔴'}}
function staffCard(){const st=staffState(),t={'🟢':'Fully staffed. Great!','🟡':'Normal, but short. Hire a few more.','🔴':'Very few employees! Hire now.'}[st.light];return '<div class="card"><div class="row"><div><h3 style="margin:0">'+st.light+' Employees: '+st.have+'</h3><div class="muted">'+t+'<br>Needed now: '+Object.keys(STAFF).map(k=>STAFF[k].n.split(' ')[0]+' '+st.n[k]).join(' · ')+'</div></div></div><button class="btn" style="margin-top:8px" '+(st.light==='🟢'?'disabled':'')+' onclick="hireAll()">Hire all needed</button></div>'}
function hireAll(){const n=need();Object.keys(STAFF).forEach(k=>{while(S.staff[k]<Math.min(10,n[k])&&S.money>=STAFF[k].fee){S.money-=STAFF[k].fee;S.staff[k]++}});save();render(true)}
function monthCtl(){return '<div class="card"><h3>Month length</h3><div class="row"><button class="btn s o" onclick="setMonth(-1)">−1 min</button><b>'+S.monthMin+' real minutes</b><button class="btn s o" onclick="setMonth(1)">+1 min</button></div><div class="muted" style="margin-top:6px">How long one month (30 days) lasts before the bill. The clock at the top counts down.</div></div>'}
function setMonth(d){S.monthMin=Math.max(1,Math.min(60,S.monthMin+d));run();save();render(true)}
function newsItems(){const sh=S.share||.5,t=S.riv.reduce((a,r)=>a+r.ap,0)||1,tot=S.users/sh,rv=S.riv.map(r=>({n:r.n,u:tot*(1-sh)*r.ap/t})),all=rv.concat([{n:S.name,u:S.users}]).sort((a,b)=>b.u-a.u),rk=all.findIndex(x=>x.n===S.name)+1,st=staffState(),it=[];
  if(S.invs.some(b=>b.late>0))it.push('🏛️ Government notice: overdue bills. Purchases are blocked'+(S.towers.some(t=>t.off)?' and some towers are shut':'')+'. Pay in the Bills tab.');Object.keys(S.atk).forEach(z=>it.push('🔥 '+S.atk[z].r+' is stealing customers in '+ZONES[z][0]));
  if(st.light!=='🟢')it.push((st.light==='🔴'?'🚨':'⚠️')+' Team is short. Open the Team tab to hire.');
  it.push('🏆 #1 SIM right now: '+all[0].n+' with '+fm(all[0].u)+' users');rv.forEach(r=>it.push('📰 '+r.n+' has sold about '+fm(r.u*1.4)+' SIMs'));it.push('📈 '+S.name+' is #'+rk+' · '+fm(S.sims)+' SIMs sold');return it}
function clock(){if(!S||S.over)return;const dl=30-(S.day%30),ms=dl*dayMs()-(Date.now()-lastTick);$('hc').textContent=S.speed?'⏱ Bill in '+Math.floor(Math.max(0,ms)/60000)+':'+String(Math.floor(Math.max(0,ms)/1000)%60).padStart(2,'0'):'⏸ Paused';const n=newsItems();$('news').textContent=n[Math.floor(Date.now()/5000)%n.length];const cr=$('cr');if(S.cr){const ms=Math.max(0,S.cr.left*dayMs()-(Date.now()-lastTick));cr.style.display='block';cr.textContent='🚨 '+crisisName()+' · '+(S.speed?Math.floor(ms/60000)+':'+String(Math.floor(ms/1000)%60).padStart(2,'0'):'paused')+' · TAP to fix · '+rs(crisisCost())}else cr.style.display='none'}
setInterval(clock,1000);
function need(){return{eng:Math.ceil(S.towers.length/4),sup:Math.ceil(S.users/4000),sales:Math.ceil(S.users/10000)}}
function invoice(c){const it=Object.assign({},S.acc);it.fine=c.hp<45?Math.round(5000+(45-c.hp)*400):0;const tot=Object.values(it).reduce((a,b)=>a+b,0);S.invs.push({m:S.day/30,it,tot,due:S.day+15,late:0});S.acc={sal:0,tax:0,twr:0,ads:0,lic:0,loan:0,fine:0,pack:0,net:0};toast('New monthly bill: '+rs(tot)+'. Pay within 15 days')}
function checkDue(){S.invs.forEach(b=>{if(S.day>=b.due+b.late*15){b.late++;const pen=Math.round(b.tot*.05);b.tot+=pen;S.rep=Math.max(0,S.rep-.03);toast('Bill is overdue. Late fee '+rs(pen))}});if(S.invs.some(b=>b.late>=2)&&!S.towers.some(t=>t.off)&&S.towers.length>1){S.towers.forEach((t,i)=>{if(i%4===0&&i>0)t.off=true});toast('🏛️ Government shut some towers. Pay your bills!')}}
function payBill(i){const b=S.invs[i];if(!b||S.money<b.tot)return;S.money-=b.tot;S.invs.splice(i,1);toast('Bill paid');if(!S.invs.some(x=>x.late>0)&&S.towers.some(t=>t.off)){S.towers.forEach(t=>t.off=false);toast('Government lifted the order. Towers are back')}save();render(true)}
function takeLoan(){if(S.loan)return;S.money+=500000;S.loan=500000;toast('Loan taken. Interest is added to your bill');save();render(true)}
function repayLoan(){if(!S.loan||S.money<S.loan)return;S.money-=S.loan;S.loan=0;toast('Loan repaid');save();render(true)}
function setPrice(d){S.price=Math.max(.7,Math.min(1.5,Math.round((S.price+d)*10)/10));save();render(true)}
function festival(){if(S.money<20000||S.offer>0)return;S.money-=20000;S.offer=10;toast('Festival offer is live!');save();render(true)}
function pricing(){return '<div class="card"><h3>Your pricing</h3><div class="row"><button class="btn s o" onclick="setPrice(-.1)">−10%</button><b>'+Math.round(S.price*100)+'% of normal price</b><button class="btn s o" onclick="setPrice(.1)">+10%</button></div><div class="muted" style="margin:6px 0 8px">Cheaper wins more users but earns less per user. Costlier does the opposite.</div><button class="btn" '+(S.money>=20000&&!S.offer?'':'disabled')+' onclick="festival()">'+(S.offer?'Festival offer running · '+S.offer+' days left':'Festival offer · Rs 20,000 · 10 days')+'</button></div>'}
function bars(it){const mx=Math.max(1,...Object.values(it));return CATS.map(a=>it[a[0]]?'<div style="margin:5px 0"><div class="row"><span>'+a[1]+'</span><b>'+rs(it[a[0]])+'</b></div><div class="bar"><i style="width:'+it[a[0]]/mx*100+'%"></i></div></div>':'').join('')}
function vBills(){
  const run=Object.values(S.acc).reduce((a,b)=>a+b,0);
  let h=monthCtl()+'<div class="card"><h3>This month so far · next bill in '+(30-S.day%30)+' days</h3>'+(run?bars(S.acc):'<div class="muted">Nothing yet</div>')+'<div class="row" style="margin-top:6px"><span>Running total</span><b>'+rs(run)+'</b></div></div>';
  h+=S.invs.length?S.invs.map((b,i)=>'<div class="card" style="border-color:var(--bad)"><h3>Month '+b.m+' bill · due in '+(b.due+b.late*15-S.day)+' days</h3>'+bars(b.it)+'<div class="row" style="margin:8px 0"><b>Total</b><b>'+rs(b.tot)+'</b></div><button class="btn" '+(S.money>=b.tot?'':'disabled')+' onclick="payBill('+i+')">Pay bill</button></div>').join(''):'<div class="card muted">No unpaid bills. Well done!</div>';
  return h+'<div class="card"><h3>Bank loan</h3><div class="muted" style="margin-bottom:8px">'+(S.loan?'You owe '+rs(S.loan)+'. Interest is added to your monthly bill.':'Rs 5,00,000 now. Interest 0.1% a day goes into your bill.')+'</div>'+(S.loan?'<button class="btn o" '+(S.money>=S.loan?'':'disabled')+' onclick="repayLoan()">Repay loan</button>':'<button class="btn" onclick="takeLoan()">Take loan</button>')+'</div>';
}
function spark(a,c){if(a.length<2)return'';const mx=Math.max(...a),mn=Math.min(...a);return'<svg viewBox="0 0 200 40" style="height:48px;border:0;background:none"><polyline points="'+a.map((v,i)=>(i*200/(a.length-1)).toFixed(1)+','+(38-(v-mn)/(mx-mn||1)*34).toFixed(1)).join(' ')+'" fill="none" stroke="'+c+'" stroke-width="2"/></svg>'}
function charts(){const h=S.h,sh=S.share||.5,t=S.riv.reduce((a,r)=>a+r.ap,0)||1;
  const row=(n,p,c)=>'<div class="row"><span>'+n+'</span><b>'+Math.round(p*100)+'%</b></div><div class="bar" style="margin-bottom:6px"><i style="width:'+p*100+'%;background:'+c+'"></i></div>';
  return '<div class="card"><h3>Market share</h3>'+row(S.name,sh,'var(--acc)')+S.riv.map(r=>row(r.n,(1-sh)*r.ap/t,'var(--muted)')).join('')+'</div><div class="card"><h3>Users</h3>'+spark(h.u,'var(--acc)')+'<h3>Daily income</h3>'+spark(h.r,'var(--good)')+'<h3>Signal</h3>'+spark(h.g,'var(--warn)')+'</div>'}
document.addEventListener('pointerdown',()=>{hold=Date.now()});
if(load()){$('start').className='ov h';if(S.over)over();else{run();render(true)}}
</script>
</body>
</html>
