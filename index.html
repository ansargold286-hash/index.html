<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Attendance System</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        /* Toast Notification Banner Style */
        #toastBanner {
            position: absolute;
            top: -60px;
            left: 0;
            width: 100%;
            background-color: #2ecc71;
            color: white;
            padding: 12px;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            transition: top 0.4s ease-in-out;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            z-index: 100;
            box-sizing: border-box;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 22px;
            line-height: 1.4;
        }
        input, .file-label {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            font-size: 15px;
            display: block;
            box-sizing: border-box;
            background-color: #f9f9f9;
        }
        input {
            text-align: left;
            direction: ltr;
        }
        .file-label {
            background-color: #3498db;
            color: white;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            transition: 0.3s;
        }
        .file-label:hover {
            background-color: #2980b9;
        }
        input[type="file"] {
            display: none;
        }
        .btn-group {
            display: flex;
            gap: 12px;
        }
        button {
            flex: 1;
            padding: 14px;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-in { background-color: #2ecc71; }
        .btn-in:hover { background-color: #27ae60; }
        .btn-out { background-color: #e74c3c; }
        .btn-out:hover { background-color: #c0392b; }
        
        .admin-icon-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #34495e;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
        }
        
        #adminPanel {
            display: none;
            text-align: left;
            margin-top: 10px;
        }
        .admin-header {
            font-size: 20px;
            color: #2c3e50;
            margin-bottom: 15px;
            font-weight: bold;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
            text-align: center;
        }
        .search-box {
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 12px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            font-size: 14px;
            text-align: left;
            box-sizing: border-box;
        }
        .record-box {
            background: #fdfefe;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            font-size: 13px;
            border: 1px solid #e1e8ed;
            border-left: 5px solid #3498db;
            text-align: left;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .record-box b {
            color: #2c3e50;
        }
        .back-btn {
            background-color: #7f8c8d;
            width: 100%;
            margin-top: 12px;
        }
        .download-btn {
            background-color: #f1c40f;
            color: #2c3e50;
            width: 100%;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .download-btn:hover {
            background-color: #f39c12;
        }
        .clear-btn {
            background-color: #c0392b;
            color: white;
            width: 100%;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .clear-btn:hover {
            background-color: #a93226;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Success Toast Notification Banner -->
        <div id="toastBanner">Success! Attendance Recorded.</div>

        <!-- Admin Button -->
        <button class="admin-icon-btn" onclick="openAdmin()">⚙️ Admin Panel</button>

        <!-- Main Form (English Only) -->
        <div id="userForm">
            <h2>Staff Attendance System</h2>
            
            <input type="text" id="empName" placeholder="Enter Full Name" required>
            
            <label for="empPhoto" class="file-label" id="photoLabel">📁 Select Photo</label>
            <input type="file" id="empPhoto" accept="image/*" onchange="previewPhoto()">

            <div class="btn-group">
                <button class="btn-in" onclick="markAttendance('Check-In')">Check-In</button>
                <button class="btn-out" onclick="markAttendance('Check-Out')">Check-Out</button>
            </div>
        </div>

        <!-- Admin Panel (English Only) -->
        <div id="adminPanel">
            <div class="admin-header">🛡️ Admin Dashboard</div>
            
            <button class="download-btn" onclick="downloadCSV()">📥 Download All Data (CSV)</button>
            <button class="clear-btn" onclick="clearAllData()">🗑️ Clear All Records</button>
            
            <input type="text" id="searchEmp" class="search-box" placeholder="🔍 Search by name..." onkeyup="filterRecords()">

            <div id="recordsList" style="max-height: 220px; overflow-y: auto; padding-right: 5px;"></div>
            
            <button class="back-btn" onclick="closeAdmin()">🔙 Back</button>
        </div>
    </div>

    <script>
        function previewPhoto() {
            const fileInput = document.getElementById('empPhoto');
            const label = document.getElementById('photoLabel');
            if (fileInput.files && fileInput.files[0]) {
                label.style.backgroundColor = "#2ecc71";
                label.innerText = "✓ Photo Selected";
            }
        }

        function showToast(message) {
            const toast = document.getElementById("toastBanner");
            toast.innerText = message;
            toast.style.top = "0px";
            setTimeout(() => {
                toast.style.top = "-60px";
            }, 3000);
        }

        function markAttendance(type) {
            const name = document.getElementById("empName").value.trim();
            const fileInput = document.getElementById("empPhoto");

            if (!name) {
                alert("Please enter your name!");
                return;
            }

            if (fileInput.files.length === 0) {
                alert("Please select your photo!");
                return;
            }

            // Generate clean timestamp: YYYY-MM-DD HH:MM:SS
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const formattedDateTime = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

            saveDataLocally(name, type, formattedDateTime);
        }

        function saveDataLocally(name, type, timestamp) {
            const record = {
                name: name,
                status: type,
                time: timestamp
            };

            let allRecords = JSON.parse(localStorage.getItem('attendanceRecords')) || [];
            allRecords.push(record);
            localStorage.setItem('attendanceRecords', JSON.stringify(allRecords));

            // Show success toast bar
            showToast(`✓ ${type} Successful for ${name} (OK)`);
            
            // Reset form fields
            document.getElementById("empName").value = "";
            document.getElementById("empPhoto").value = "";
            document.getElementById("photoLabel").style.backgroundColor = "#3498db";
            document.getElementById("photoLabel").innerText = "📁 Select Photo";
        }

        function openAdmin() {
            let pass = prompt("Enter Admin Password:");
            if (pass === "707670") {
                document.getElementById("userForm").style.display = "none";
                document.getElementById("adminPanel").style.display = "block";
                loadRecords();
            } else if (pass !== null) {
                alert("Incorrect Password!");
            }
        }

        function closeAdmin() {
            document.getElementById("adminPanel").style.display = "none";
            document.getElementById("userForm").style.display = "block";
        }

        function loadRecords(filter = "") {
            const listDiv = document.getElementById("recordsList");
            let allRecords = JSON.parse(localStorage.getItem('attendanceRecords')) || [];
            
            if (allRecords.length === 0) {
                listDiv.innerHTML = "<p style='color: #7f8c8d; text-align:center;'>No records found.</p>";
                return;
            }

            let html = "";
            allRecords.reverse().forEach((rec) => {
                if (filter === "" || rec.name.toLowerCase().includes(filter.toLowerCase())) {
                    html += `<div class="record-box">
                        <b>Name:</b> ${rec.name}<br>
                        <b>Status:</b> <span style="color:${rec.status === 'Check-In' ? '#2ecc71' : '#e74c3c'}; font-weight:bold;">${rec.status}</span><br>
                        <b>Date & Time:</b> ${rec.time}
                    </div>`;
                }
            });
            listDiv.innerHTML = html || "<p style='color: #7f8c8d; text-align:center;'>No results found.</p>";
        }

        function filterRecords() {
            let query = document.getElementById("searchEmp").value;
            loadRecords(query);
        }

        function downloadCSV() {
            let allRecords = JSON.parse(localStorage.getItem('attendanceRecords')) || [];
            if (allRecords.length === 0) {
                alert("No data available to download!");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,Name,Status,Date_Time\n";
            allRecords.forEach(rec => {
                csvContent += `"${rec.name}","${rec.status}","${rec.time}"\n`;
            });

            var encodedUri = encodeURI(csvContent);
            var link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "Attendance_Report.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function clearAllData() {
            if (confirm("Are you sure you want to clear all attendance records? This cannot be undone!")) {
                localStorage.removeItem('attendanceRecords');
                loadRecords();
                alert("All records cleared successfully!");
            }
        }
    </script>

</body>
</html>
